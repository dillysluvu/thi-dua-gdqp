<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2f2a">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('THI_DUA_GDQPAN_V3:theme');
        var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#07110f');
        }
      } catch (error) {}
    })();
  </script>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <meta name="description" content="Bảng theo dõi, chấm điểm và tổng hợp thi đua trung đội GDQP&AN. Hỗ trợ nhập Excel, nhiều khóa, cộng tác nhóm và dùng tốt trên điện thoại.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Thi Đua GDQP&AN</title>
</head>
<body>
  <div id="root">
    <div class="boot-screen">
      <div class="boot-mark">★</div>
      <strong>Đang tải Thi Đua GDQP&amp;AN...</strong>
    </div>
  </div>
  <noscript>Ứng dụng cần JavaScript để hoạt động. Hãy bật JavaScript trong trình duyệt.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
